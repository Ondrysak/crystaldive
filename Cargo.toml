[package]
name = "crystal-viz"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu        = "22"
winit       = "0.30"
glam        = "0.29"
bytemuck    = { version = "1", features = ["derive"] }
pollster    = "0.3"
env_logger  = "0.11"
log         = "0.4"
egui        = "0.29"
egui-wgpu   = "0.29"
egui-winit  = { version = "0.29", default-features = false }
image       = { version = "0.24", default-features = false, features = ["png"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal        = "0.15"
rustfft     = "6"
midir       = "0.10"

[dev-dependencies]
# Pinned to the same naga wgpu 22 pulls in, so the shader-validation test
# parses WGSL with the exact frontend the runtime uses (no GPU needed).
naga = { version = "22", features = ["wgsl-in"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
web-time = "1"
web-sys = { version = "=0.3.77", features = ["Window", "HtmlCanvasElement", "CssStyleDeclaration"] }
