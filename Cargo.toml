[package]
name = "crystal-viz"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu        = "22"
winit       = "0.30"
glam        = "0.29"
bytemuck    = { version = "1", features = ["derive"] }
pollster    = "0.3"
env_logger  = "0.11"
log         = "0.4"
egui        = "0.29"
egui-wgpu   = "0.29"
egui-winit  = "0.29"
image       = { version = "0.24", default-features = false, features = ["png"] }
cpal        = "0.15"
rustfft     = "6"
